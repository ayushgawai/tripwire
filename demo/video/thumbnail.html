<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;font-family:Inter;color:#1F2023;background:radial-gradient(900px 600px at 72% 50%,#fff 0%,#F1F1EF 55%,#E7E3DC 100%);position:relative}
.quote{position:absolute;left:64px;top:92px;width:640px;font:700 76px/1.02 Fraunces,serif;letter-spacing:-.02em}
.quote em{font-style:normal;color:#E5384F}
.sub{position:absolute;left:66px;top:438px;font:800 46px Inter;letter-spacing:-.01em;display:flex;align-items:center;gap:16px}
.sub i{display:inline-block;width:22px;height:22px;border-radius:50%;background:#E5384F;box-shadow:0 0 0 8px rgba(229,56,79,.18)}
.brand{position:absolute;left:66px;bottom:58px;display:flex;align-items:center;gap:14px;font:700 34px Fraunces,serif}
.logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#F1DDB0,#D4B47A 45%,#9C7A45);display:flex;align-items:center;justify-content:center}
.glow{position:absolute;left:820px;top:120px;width:480px;height:480px;border-radius:50%;background:rgba(229,56,79,.42);filter:blur(60px)}
.band{position:absolute;left:900px;top:110px;width:200px;height:470px;border-radius:100px;background:linear-gradient(160deg,#2b2d31,#141518);transform:rotate(-14deg);box-shadow:0 40px 80px -30px rgba(0,0,0,.6)}
.pod{position:absolute;left:24px;top:125px;width:152px;height:220px;border-radius:58px;background:linear-gradient(160deg,#34363b,#1b1c20);border:2px solid rgba(201,164,106,.6)}
.led{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;transform:translate(-50%,-50%);background:#FF3B54;box-shadow:0 0 30px 10px rgba(255,59,84,.8)}
.tag{position:absolute;left:830px;top:600px;font:800 24px Inter;letter-spacing:.14em;color:#fff;background:#E5384F;padding:12px 22px;border-radius:999px}
</style></head><body>
<div class="quote">“Grandpa, buy gift cards. <em>Right now.</em>”</div>
<div class="sub"><i></i>Tripwire stepped in.</div>
<div class="brand"><div class="logo"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F2023" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2.5-6 4 12 2.5-6H22"/></svg></div>Tripwire <span style="font:600 24px Inter;color:#4A4E54;margin-left:8px">on the Vexo band</span></div>
<div class="glow"></div>
<div class="band"><div class="pod"><div class="led"></div></div></div>
<div class="tag">SCAM DETECTED</div>
</body></html>
